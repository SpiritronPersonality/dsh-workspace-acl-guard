# dsh-workspace-acl-guard 的组合包补丁。
#
# 安装：在 DSH 的「插件」页安装，或链接本地目录：
#   dsh plugin --profile <profile> add "<本目录的绝对路径>"
#
# 本插件是只读的：绝不写安全描述符。停用或删除这一行即可卸载；
# 它写在 $DSH_HOME/acl-guard 的日志是普通 JSONL，DSH 本身不会读取。

- insert:
    - id: workspace-acl-guard
      name: 'dsh-workspace-acl-guard'
      config:
        locale: zh
        watch: true
        intervalMs: 60000
        scanKnownFolders: true
